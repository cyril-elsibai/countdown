<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>6/7 Numbers — Daily Number Puzzle</title>
    <meta name="description" content="A free daily number puzzle. Reach the target with six numbers and four operations, then compare your score with friends." />
    <link rel="canonical" href="https://www.67numbers.com/" />

    <!-- Link previews (WhatsApp, iMessage, X, Facebook…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="6/7 Numbers" />
    <meta property="og:title" content="6/7 Numbers — Daily Number Puzzle" />
    <meta property="og:description" content="Reach the target with six numbers and four operations. A new challenge every day." />
    <meta property="og:url" content="https://www.67numbers.com/" />
    <meta property="og:image" content="https://www.67numbers.com/og-image.png?v=2" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="6/7 Numbers logo" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "6/7 Numbers",
        "url": "https://www.67numbers.com/",
        "description": "A free daily number puzzle. Reach the target with six numbers and four operations.",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Any",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png?v=4" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=4" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131416" media="(prefers-color-scheme: dark)" />

    <!-- Archivo: one family, variable width (narrow for numbers, normal for text) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" />

    <!-- iOS -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="6/7 Numbers" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
